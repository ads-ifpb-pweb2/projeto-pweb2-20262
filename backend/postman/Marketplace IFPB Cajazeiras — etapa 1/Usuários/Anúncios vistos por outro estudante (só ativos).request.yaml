$kind: http-request
description: "Os anúncios do estudante de exemplo, com o token do estudante do Cadastro: só os ativos aparecem."
url: "{{baseUrl}}/usuarios/{{usuarioId}}/anuncios?pagina=1&tamanho=5"
method: GET
queryParams:
  pagina: "1"
  tamanho: "5"
auth:
  type: bearer
  credentials:
    token: "{{outroToken}}"
scripts:
  - type: afterResponse
    code: pm.test("status 200", () => pm.response.to.have.status(200));
    language: text/javascript
order: 6000
