$kind: http-request
url: "{{baseUrl}}/anuncios?modalidade=venda&categoria=eletronicos&precoMin=10&precoMax=100&ordem=preco&direcao=asc&pagina=1&tamanho=5"
method: GET
queryParams:
  modalidade: venda
  categoria: eletronicos
  precoMin: "10"
  precoMax: "100"
  ordem: preco
  direcao: asc
  pagina: "1"
  tamanho: "5"
scripts:
  - type: afterResponse
    code: pm.test("status 200", () => pm.response.to.have.status(200));
    language: text/javascript
order: 4000
