$kind: http-request
url: "{{baseUrl}}/anuncios?modalidade=venda&ordem=preco&direcao=desc"
method: GET
queryParams:
  modalidade: venda
  ordem: preco
  direcao: desc
scripts:
  - type: afterResponse
    code: pm.test("status 200", () => pm.response.to.have.status(200));
    language: text/javascript
order: 3000
