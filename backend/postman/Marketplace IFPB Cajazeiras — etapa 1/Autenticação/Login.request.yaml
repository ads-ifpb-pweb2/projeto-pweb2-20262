$kind: http-request
description: Login do estudante de exemplo, da carga. Guarda o token e o id do usuário nas variáveis da coleção.
url: "{{baseUrl}}/auth/login"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "email": "estudante@academico.ifpb.edu.br",
      "senha": "senha123"
    }
auth:
  type: noauth
scripts:
  - type: afterResponse
    code: |-
      pm.test("status 200", () => pm.response.to.have.status(200));
      const corpo = pm.response.json();
      pm.collectionVariables.set("token", corpo.token);
      pm.collectionVariables.set("usuarioId", corpo.usuario.id);
    language: text/javascript
order: 2000
