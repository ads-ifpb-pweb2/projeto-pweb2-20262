$kind: http-request
description: "Estados: ativo, pausado, reservado, vendido (só vendas) e concluido (só doações)."
url: "{{baseUrl}}/anuncios/{{anuncioId}}/estado"
method: PATCH
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "estado": "reservado"
    }
scripts:
  - type: afterResponse
    code: pm.test("status 200", () => pm.response.to.have.status(200));
    language: text/javascript
order: 5000
