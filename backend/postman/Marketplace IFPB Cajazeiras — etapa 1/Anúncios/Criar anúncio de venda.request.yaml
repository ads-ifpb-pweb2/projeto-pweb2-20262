$kind: http-request
description: multipart/form-data. De 1 a 10 arquivos no campo `fotos`; `capaIndice` é a posição da capa (a partir de 0).
url: "{{baseUrl}}/anuncios"
method: POST
body:
  type: formdata
  content:
    - type: text
      key: titulo
      value: Fone de ouvido com fio
    - type: text
      key: descricao
      value: Fone P2, funcionando perfeitamente.
    - type: text
      key: estadoConservacao
      value: usado
    - type: text
      key: categoriaId
      value: "1"
    - type: text
      key: localEntrega
      value: Biblioteca
    - type: text
      key: modalidade
      value: venda
    - type: text
      key: preco
      value: "35.50"
    - type: file
      key: fotos
      src: backend/db/fotos/anuncio-01-1.jpg
    - type: file
      key: fotos
      src: backend/db/fotos/anuncio-01-2.jpg
    - type: text
      key: capaIndice
      value: "0"
scripts:
  - type: afterResponse
    code: |-
      pm.test("status 201", () => pm.response.to.have.status(201));
      const corpo = pm.response.json();
      pm.collectionVariables.set("anuncioId", corpo.id);
      pm.collectionVariables.set("fotoId", corpo.fotos[0].id);
    language: text/javascript
order: 1000
