$kind: http-request
url: "{{baseUrl}}/auth/cadastro"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "nome": "Fulano",
      "email": "fulano@gmail.com",
      "senha": "123",
      "cursoId": 1
    }
auth:
  type: noauth
scripts:
  - type: afterResponse
    code: |-
      pm.test("status 400", () => pm.response.to.have.status(400));
      pm.test("erro no campo email", () => pm.expect(pm.response.json().campos).to.have.property("email"));
    language: text/javascript
order: 1000
