$kind: http-request
url: "{{baseUrl}}/anuncios/{{doacaoId}}/estado"
method: PATCH
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "estado": "vendido"
    }
scripts:
  - type: afterResponse
    code: pm.test("status 400", () => pm.response.to.have.status(400));
    language: text/javascript
order: 7000
