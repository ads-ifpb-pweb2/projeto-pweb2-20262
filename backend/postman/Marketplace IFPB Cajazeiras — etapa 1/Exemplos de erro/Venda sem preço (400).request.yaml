$kind: http-request
url: "{{baseUrl}}/anuncios"
method: POST
body:
  type: formdata
  content:
    - type: text
      key: titulo
      value: Fone de ouvido com fio
    - type: text
      key: descricao
      value: Fone P2, funcionando perfeitamente.
    - type: text
      key: estadoConservacao
      value: usado
    - type: text
      key: categoriaId
      value: "1"
    - type: text
      key: localEntrega
      value: Biblioteca
    - type: text
      key: modalidade
      value: venda
    - type: file
      key: fotos
      src: backend/db/fotos/anuncio-01-1.jpg
scripts:
  - type: afterResponse
    code: pm.test("status 400", () => pm.response.to.have.status(400));
    language: text/javascript
order: 6000
