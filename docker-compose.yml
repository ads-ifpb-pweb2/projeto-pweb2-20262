services:
  api:
    build: ./backend
    ports:
      - "8080:8080"
    env_file: .env
    environment:
      DB_URL: jdbc:sqlite:/app/data/marketplace.db
      CARGA_DIR: /app/db
      S3_ENDPOINT: http://armazenamento:9000
      S3_PUBLIC_URL: http://localhost:9000
      S3_BUCKET: marketplace
    volumes:
      - dados:/app/data
      - ./backend/db:/app/db:ro
    depends_on:
      armazenamento:
        condition: service_healthy

  armazenamento:
    image: rustfs/rustfs:1.0.3
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      RUSTFS_ACCESS_KEY: ${S3_ACCESS_KEY}
      RUSTFS_SECRET_KEY: ${S3_SECRET_KEY}
      RUSTFS_CONSOLE_ENABLE: "true"
    volumes:
      - fotos:/data
    healthcheck:
      test: ["CMD", "curl", "-fs", "http://localhost:9000/health"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  dados:
  fotos:
